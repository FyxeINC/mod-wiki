<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fyxe's Mod Wiki — Wiki</title>
<meta name="description" content="Documentation for Fyxe's Minecraft mods.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>(function(){var t;try{t=localStorage.getItem("wiki-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))})();</script>
</head>
<body>

<div data-site-header></div>

<section class="hero">
  <div>
    <span class="ledger-stamp"><span class="dot"></span> FYXE — MINECRAFT MODS</span>
    <h1>Documentation for my Minecraft mods.</h1>
    <p class="hero__lede" data-site-description>Documentation for Fyxe's Minecraft mods, including projects awaiting publication.</p>
    <div class="hero__actions">
      <a class="btn btn--primary" href="projects/index.html">Browse projects</a>
      <a class="btn btn--ghost" href="compatibility.html">Check compatibility</a>
    </div>
  </div>
  <aside class="hero-stats" data-site-stats aria-label="Wiki at a glance"></aside>
</section>

<main class="layout layout--wide">
  <div class="content content--home">

    <section class="home-updates" aria-labelledby="recent-updates">
      <div class="section-heading"><h2 id="recent-updates">Recent updates</h2><a class="text-link" href="updates.html">All updates →</a></div>
      <ol class="update-list update-list--compact" data-recent-updates data-limit="3"></ol>
    </section>

    <section aria-labelledby="all-projects">
      <h2 class="sr-only" id="all-projects">All projects</h2>
      <div data-project-grid></div>
    </section>

  </div>
</main>

<div data-site-footer></div>

<script>window.SITE_ROOT = "";</script>
<script src="assets/js/wiki-data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
